name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run budget
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/test-report.html
